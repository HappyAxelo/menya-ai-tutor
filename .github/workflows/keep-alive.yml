# Supabase pauses free projects after a week without activity. This calls the
# public plans endpoint (which reads the database) every 3 days, so the free
# project stays up between early-adopter sessions. Free on GitHub Actions for
# public repositories. Remove it once the project is on a paid plan.
#
# Note: GitHub turns off scheduled workflows in a repository with no commits
# for 60 days; any push turns it back on (or run it from the Actions tab).
name: Keep backend awake

on:
  schedule:
    - cron: "17 6 */3 * *"   # 06:17 UTC every third day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the API (reads the database)
        run: |
          status=$(curl -s -o /tmp/plans.json -w "%{http_code}" --max-time 30 \
            https://tgrihnmngbamxxjnedlc.supabase.co/functions/v1/api/plans)
          echo "HTTP $status"; head -c 200 /tmp/plans.json; echo
          test "$status" = "200"
