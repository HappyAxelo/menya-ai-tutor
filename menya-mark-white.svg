<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 91" role="img" aria-label="Menya AI Tutor logo (white)">
  <!-- Menya mark: a learner (head + M) rising from an open book.
       White version for coloured backgrounds (as on the gradient app icon in docs/brand). -->
  <defs>
    <linearGradient id="mn-g" x1="2" y1="10" x2="98" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3cc8ff"/>
      <stop offset="0.27" stop-color="#2a6cf3"/>
      <stop offset="0.52" stop-color="#8b4fd8"/>
      <stop offset="0.76" stop-color="#ec5a8c"/>
      <stop offset="1" stop-color="#fb9e5a"/>
    </linearGradient>
    <linearGradient id="mn-head" x1="42" y1="3" x2="58" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a2ff"/>
      <stop offset="1" stop-color="#9b6cf0"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="11.2" r="7.9" fill="#ffffff"/>

  <!-- The M as one folded ribbon; legs tuck behind the book -->
  <path d="M25 66 V31 Q25 21 34.5 25 L50 42 L65.5 25 Q75 21 75 31 V66"
        fill="none" stroke="#ffffff" stroke-width="15.5" stroke-linejoin="round"/>
  <!-- Fold: the left diagonal face catches the light -->
  <path d="M30 25.2 L50 46" fill="none" stroke="#000000" stroke-opacity="0.10" stroke-width="12"/>

  <!-- Open book: three even-width pages each side, flaring up at the edges and meeting at the spine -->
  <g fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linecap="round">
    <path d="M50 71 C45 62 22 59 4.5 49"/>
    <path d="M50 79 C44 70 20 67 3.5 58"/>
    <path d="M50 87 C44 78 20 75 4.5 66.5"/>
    <path d="M50 71 C55 62 78 59 95.5 49"/>
    <path d="M50 79 C56 70 80 67 96.5 58"/>
    <path d="M50 87 C56 78 80 75 95.5 66.5"/>
  </g>
</svg>
